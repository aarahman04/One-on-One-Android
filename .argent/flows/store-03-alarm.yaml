steps:
  - tool: restart-app
    args: { bundleId: app.web.oneonone, activity: .StoreAlarmActivity }
  - await: { visible: { text: "Emergency alarm from Arjun" } }
  - await: { visible: { text: "Emergency alarm" } }
  - await: { visible: { text: "tap to acknowledge" } }
  - await: { visible: { text: Arjun } }
  - await: { visible: { text: Message } }
  - await: { idle: true }
